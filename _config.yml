# Site settings
title: "Jekyll Resume Template"
description: "A resume template for Jekyll and GitHub Pages sites."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Phillip O. Johnson"
resume_title:                   "IT Security Researcher"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "phil.j.tech@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "713-540-3240"
resume_contact_address:         "21615 Country Club Green Dr, Tomball TX"

resume_header_contact_info:     "21615 Country Club Green Dr, Tomball TX • 713-540-3240 • phil.j.tech@gmail.com"
display_header_contact_info:    "false"

resume_header_intro: "<p>Technician with solid experience in RF systems, electronics, and network infrastructure. Driven to transition into software development, leveraging strong technical skills and a problem-solving mindset. Ready to tackle software challenges and contribute to innovative solutions.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
resume_section_links:           true
resume_section_associations:    true
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "Hhttps://Failsoft47.github.io/"
  resume_twitter_url:           "https://x.com/Philosdaemo/"
  resume_dribbble_url:          "https://dribbble.com/"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://www.linkedin.com/in/phillip-johnson-840a4a224/"
  # resume_instagram_url:         "insert your Instagram URL here"
  resume_website_url:           "http://helvatechnologies.com/"
  resume_medium_url:            "https://medium.com/"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts
